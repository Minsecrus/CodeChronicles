<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>代码战纪</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/vendor/lucide.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <div class="brand">
          <span class="brand-mark"><i data-lucide="code-2" class="ic"></i></span>
          <h1>代码战纪</h1>
        </div>

        <nav class="tab-nav" aria-label="主导航">
          <button class="tab-btn active" data-tab="battle"><i data-lucide="swords" class="ic"></i><span>征战</span></button>
          <button class="tab-btn" data-tab="roster"><i data-lucide="users" class="ic"></i><span>编队</span></button>
          <button class="tab-btn" data-tab="armory"><i data-lucide="hammer" class="ic"></i><span>工坊</span></button>
          <button class="tab-btn" data-tab="gacha"><i data-lucide="sparkles" class="ic"></i><span>召唤</span></button>
          <button class="tab-btn" data-tab="gm"><i data-lucide="terminal" class="ic"></i><span>GM</span></button>
        </nav>
      </div>

      <div class="topbar-right">
        <div class="resource-bar">
          <div class="res-pill diamond" title="钻石">
            <i data-lucide="gem" class="ic"></i>
            <span id="res-diamonds" class="res-val">0</span>
          </div>
          <div class="res-pill gold" title="金币">
            <i data-lucide="coins" class="ic"></i>
            <span id="res-gold" class="res-val">0</span>
          </div>
          <div class="res-pill exp" title="算力晶体">
            <i data-lucide="cpu" class="ic"></i>
            <span id="res-exp" class="res-val">0</span>
          </div>
          <div class="res-pill power-pill" title="出战总战力">
            <i data-lucide="swords" class="ic"></i>
            <span id="res-power" class="res-val">0</span>
          </div>
        </div>

        <button class="btn btn-ghost btn-sm theme-toggle" id="btn-theme" title="切换护眼日间 / 夜间模式">
          <i data-lucide="moon" class="ic"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <main class="main-content">
      <!-- 1. 征战 -->
      <section id="tab-battle" class="tab-panel active">
        <div class="battle-layout">
          <aside class="panel stage-sidebar">
            <div class="panel-head">
              <h2><i data-lucide="flag" class="ic"></i>关卡列表</h2>
              <span class="badge" id="stage-progress-text">0</span>
            </div>
            <div class="stage-list" id="stage-list"></div>
          </aside>

          <div class="panel battle-arena-wrap">
            <div class="panel-head arena-header">
              <div class="arena-title-group">
                <h2 id="arena-stage-title">—</h2>
                <p class="muted" id="arena-synergy-text">—</p>
              </div>
              <div class="arena-controls">
                <button class="btn btn-ghost btn-sm" id="btn-speed" title="切换战斗倍速"><i data-lucide="gauge" class="ic"></i><span>1x</span></button>
                <button class="btn btn-ghost btn-sm" id="btn-skip" disabled title="跳过动画"><i data-lucide="skip-forward" class="ic"></i></button>
                <button class="btn btn-primary" id="btn-fight" title="开战"><i data-lucide="swords" class="ic"></i></button>
              </div>
            </div>

            <div class="arena-board" id="arena-board">
              <div class="unit-row" id="enemy-units"></div>
              <div class="arena-divider"><span>VS</span></div>
              <div class="unit-row" id="ally-units"></div>
            </div>

            <div class="battle-result-banner hidden" id="battle-result-banner"></div>
          </div>
        </div>
      </section>

      <!-- 2. 编队与造卡 -->
      <section id="tab-roster" class="tab-panel">
        <div class="panel team-panel">
          <div class="panel-head">
            <h2><i data-lucide="shield" class="ic"></i>出战小队</h2>
            <div id="roster-synergy-badges" class="bond-badges-wrap"></div>
          </div>
          <div class="team-slots" id="team-slots"></div>
        </div>

        <div class="panel custom-builder-panel hidden" id="custom-builder-panel">
          <div class="panel-head">
            <h2><i data-lucide="user-plus" class="ic"></i>定制朋友卡牌</h2>
            <button class="btn btn-ghost btn-sm" id="btn-close-builder"><i data-lucide="x" class="ic"></i></button>
          </div>
          <form id="custom-hero-form" class="builder-form">
            <div class="builder-row">
              <label>名称<input type="text" id="ch-name" placeholder="姓名 / 昵称" required maxlength="24" /></label>
              <label>称号<input type="text" id="ch-title" placeholder="例如：摸鱼架构师" maxlength="28" /></label>
              <label>品质
                <select id="ch-rarity" class="select-input">
                  <option value="violet_gold">紫金</option>
                  <option value="platinum">白金</option>
                  <option value="gold" selected>金</option>
                  <option value="red">红</option>
                  <option value="orange">橙</option>
                  <option value="purple">紫</option>
                  <option value="blue">蓝</option>
                  <option value="green">绿</option>
                  <option value="gray">灰</option>
                </select>
              </label>
              <label>阵营
                <select id="ch-element" class="select-input">
                  <option value="kernel">内核</option>
                  <option value="algo" selected>算法</option>
                  <option value="arch">架构</option>
                  <option value="ai">算力</option>
                </select>
              </label>
            </div>
            <div class="builder-domains" id="ch-domains-sliders"></div>
            <div class="builder-row">
              <label>被动机制<select id="ch-passive" class="select-input"></select></label>
              <label>终结技<select id="ch-skill" class="select-input"></select></label>
              <label>技名（可选）<input type="text" id="ch-skill-name" placeholder="默认" maxlength="24" /></label>
              <div style="display:flex;align-items:flex-end">
                <button type="submit" class="btn btn-primary" style="width:100%"><i data-lucide="check" class="ic"></i>生成卡牌</button>
              </div>
            </div>
          </form>
        </div>

        <div class="roster-split">
          <div class="panel roster-grid-panel">
            <div class="panel-head">
              <div class="roster-head-left">
                <h2><i data-lucide="layout-grid" class="ic"></i>角色图鉴</h2>
                <span class="badge" id="roster-count-text">0/18</span>
              </div>
              <div class="roster-head-right">
                <div class="filter-pills" id="roster-filters">
                  <button class="filter-pill active" data-filter="all">全部</button>
                  <button class="filter-pill" data-filter="team">出战</button>
                  <button class="filter-pill" data-filter="kernel">内核</button>
                  <button class="filter-pill" data-filter="algo">算法</button>
                  <button class="filter-pill" data-filter="arch">架构</button>
                  <button class="filter-pill" data-filter="ai">算力</button>
                </div>
                <button class="btn btn-primary btn-sm" id="btn-open-builder"><i data-lucide="user-plus" class="ic"></i>造卡</button>
              </div>
            </div>
            <div class="hero-grid" id="hero-grid"></div>
          </div>

          <aside class="panel hero-detail-panel" id="hero-detail-panel">
            <div class="empty-detail">点击左侧角色查看详情</div>
          </aside>
        </div>
      </section>

      <!-- 3. 工坊 -->
      <section id="tab-armory" class="tab-panel">
        <div class="armory-top-grid">
          <div class="panel armory-banner-card">
            <div class="panel-head">
              <div>
                <h2><i data-lucide="hammer" class="ic"></i>外设锻造</h2>
                <p class="muted">打造高阶外设，激活 2/4 件套属性共鸣</p>
              </div>
              <span class="badge" id="pity-equip-text">0/10</span>
            </div>
            <div class="progress-track" style="margin-bottom:14px"><div class="progress-fill sr" id="pity-equip-bar"></div></div>
            <div class="armory-actions">
              <button class="btn btn-outline btn-col" data-forge="1"><span>锻造 ×1</span><small class="res-inline"><i data-lucide="coins" class="ic ic-sm res-ic gold"></i>1,500</small></button>
              <button class="btn btn-primary btn-col" data-forge="10"><span>锻造 ×10</span><small class="res-inline"><i data-lucide="coins" class="ic ic-sm res-ic gold"></i>13,500</small></button>
            </div>
          </div>

          <div class="panel armory-banner-card">
            <div class="panel-head">
              <div>
                <h2><i data-lucide="compass" class="ic"></i>圣物寻宝</h2>
                <p class="muted">探索传奇圣物与系统印记，解锁专属被动</p>
              </div>
              <span class="badge" id="pity-treasure-text">0/10</span>
            </div>
            <div class="progress-track" style="margin-bottom:14px"><div class="progress-fill ssr" id="pity-treasure-bar"></div></div>
            <div class="armory-actions">
              <button class="btn btn-outline btn-col" data-explore="1"><span>寻宝 ×1</span><small class="res-inline"><i data-lucide="gem" class="ic ic-sm res-ic diamond"></i>200</small></button>
              <button class="btn btn-special btn-col" data-explore="10"><span>寻宝 ×10</span><small class="res-inline"><i data-lucide="gem" class="ic ic-sm res-ic diamond"></i>1,800</small></button>
            </div>
          </div>
        </div>

        <div class="panel armory-bag-panel">
          <div class="panel-head">
            <div class="bag-tabs">
              <button class="btn btn-sm btn-primary" id="bag-tab-equip"><i data-lucide="keyboard" class="ic"></i>外设 (<span id="bag-equip-count">0</span>)</button>
              <button class="btn btn-sm btn-outline" id="bag-tab-treasure"><i data-lucide="gem" class="ic"></i>圣物 (<span id="bag-treasure-count">0</span>)</button>
            </div>
          </div>
          <div class="armory-grid" id="armory-grid"></div>
        </div>
      </section>

      <!-- 4. 召唤 -->
      <section id="tab-gacha" class="tab-panel">
        <div class="panel gacha-banner">
          <div class="gacha-info">
            <h2><i data-lucide="sparkles" class="ic"></i>开源星海</h2>
            <div class="pity-meters">
              <div class="pity-box">
                <div class="pity-label"><span>紫+ 保底</span><span id="pity-sr-text">0 / 10</span></div>
                <div class="progress-track"><div class="progress-fill sr" id="pity-sr-bar"></div></div>
              </div>
              <div class="pity-box">
                <div class="pity-label"><span>红+ 保底</span><span id="pity-ssr-text">0 / 50</span></div>
                <div class="progress-track"><div class="progress-fill ssr" id="pity-ssr-bar"></div></div>
              </div>
            </div>
          </div>

          <div class="gacha-actions">
            <button class="btn btn-outline btn-col" data-pull="1"><span>召唤 ×1</span><small class="res-inline"><i data-lucide="gem" class="ic ic-sm res-ic diamond"></i>160</small></button>
            <button class="btn btn-primary btn-col" data-pull="10"><span>召唤 ×10</span><small class="res-inline"><i data-lucide="gem" class="ic ic-sm res-ic diamond"></i>1,500</small></button>
            <button class="btn btn-special btn-col" data-pull="50"><span>召唤 ×50</span><small class="res-inline"><i data-lucide="gem" class="ic ic-sm res-ic diamond"></i>7,000</small></button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2><i data-lucide="award" class="ic"></i>召唤结果</h2>
            <span class="muted" id="gacha-summary-text">—</span>
          </div>
          <div class="gacha-grid" id="gacha-grid"></div>
        </div>
      </section>

      <!-- 5. GM -->
      <section id="tab-gm" class="tab-panel">
        <div class="panel">
          <div class="panel-head">
            <h2><i data-lucide="terminal" class="ic"></i>调试控制台</h2>
          </div>
          <div class="gm-grid">
            <button class="gm-tile accent" data-gm="linus_jeff">
              <div class="gm-tile-icon"><i data-lucide="crown" class="ic ic-md"></i></div>
              <strong>Linus + Jeff Dean</strong>
              <span>解锁并直接上阵两位传奇大神</span>
            </button>
            <button class="gm-tile" data-gm="resources">
              <div class="gm-tile-icon"><i data-lucide="gem" class="ic ic-md"></i></div>
              <strong>海量资源补给</strong>
              <span class="res-inline-group">
                <span class="res-inline"><i data-lucide="gem" class="ic ic-sm res-ic diamond"></i>+99k</span>
                <span class="res-inline"><i data-lucide="coins" class="ic ic-sm res-ic gold"></i>+500k</span>
                <span class="res-inline"><i data-lucide="cpu" class="ic ic-sm res-ic exp"></i>+50k</span>
              </span>
            </button>
            <button class="gm-tile" data-gm="unlock_all">
              <div class="gm-tile-icon"><i data-lucide="users" class="ic ic-md"></i></div>
              <strong>解锁全部角色</strong>
              <span class="res-inline-group">全图鉴角色 · <span class="res-inline"><i data-lucide="puzzle" class="ic ic-sm res-ic shard"></i>+100</span></span>
            </button>
            <button class="gm-tile accent" data-gm="max_team">
              <div class="gm-tile-icon"><i data-lucide="chevrons-up" class="ic ic-md"></i></div>
              <strong>出战小队满配</strong>
              <span>当前出战成员直升 Lv.100 ★6</span>
            </button>
            <button class="gm-tile accent" data-gm="god_gear">
              <div class="gm-tile-icon"><i data-lucide="package" class="ic ic-md"></i></div>
              <strong>发放神装圣物</strong>
              <span>3 套 +30 紫金外设与 6 件传奇圣物</span>
            </button>
            <button class="gm-tile danger" data-gm="reset">
              <div class="gm-tile-icon"><i data-lucide="rotate-ccw" class="ic ic-md"></i></div>
              <strong>重置游戏存档</strong>
              <span>清空进度并恢复初始状态</span>
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="gear-modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-card" id="gear-modal"></div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
